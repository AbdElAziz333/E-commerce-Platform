apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
  namespace: ecommerce-platform
  labels:
    app: product
    app.kubernetes.io/name: product
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product
  template:
      metadata:
        labels:
          app: product
          app.kubernetes.io/name: product
          app.kubernetes.io/part-of: ecommerce-platform
      spec:
        terminationGracePeriodSeconds: 30
        containers:
          - name: product
            image: abdelaziz333/ecommerce-product:0.0.1
            imagePullPolicy: Never
            ports:
              - name: http
                containerPort: 8082
                protocol: TCP
            envFrom:
              - configMapRef:
                  name: product-config
              - secretRef:
                  name: product-secret
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 1024Mi
            readinessProbe:
              httpGet:
                path: /actuator/health/readiness
                port: 8082
              initialDelaySeconds: 10
              periodSeconds: 5
              failureThreshold: 3
            livenessProbe:
              httpGet:
                path: /actuator/health/liveness
                port: 8082
              periodSeconds: 10
              failureThreshold: 3
            startupProbe:
              httpGet:
                path: /actuator/health
                port: 8082
              initialDelaySeconds: 10
              periodSeconds: 5
              failureThreshold: 30
            lifecycle:
              preStop:
                exec:
                  command: [ "/bin/sh", "-c", "sleep 5" ]
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          fsGroup: 1000