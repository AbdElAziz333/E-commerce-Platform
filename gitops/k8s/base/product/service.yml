apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: ecommerce-platform
  labels:
    app: product
    app.kubernetes.io/name: product
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  type: ClusterIP
  selector:
    app: product
  ports:
    - name: http
      port: 8082
      targetPort: http
      protocol: TCP