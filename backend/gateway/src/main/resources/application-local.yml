spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/auth
    username: aziz
    password: aziz333
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      server:
        webmvc:
          routes:
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/v1/products/**

            - id: cart-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/carts/**

            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**

            - id: order-items-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/order-items/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    serviceUrl:
      defaultZone: http://localhost:8080/eureka/
      
jwt:
  accessToken:
    secret: katykatykatykatykatykatykatykaty
    cookieName: access_token
    maxAge: 900000 # 15 minutes
    secured: false
  refreshToken:
    secret: azizazizazizazizazizazizazizaziz
    cookieName: refresh_token
    maxAge: 1209600000 # 15 days
    secured: false