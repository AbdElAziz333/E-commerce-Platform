x-common-service: &common-service
  networks:
    ecommerce-net:
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: aziz
      POSTGRES_PASSWORD: aziz333
    <<: *common-service

  redis:
    image: redis:8.6.2-alpine
    ports:
      - "6379:6379"
    <<:  *common-service

  mongo:
    image: mongo:8.3
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./infra/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    environment:
      MONGO_INITDB_DATABASE: product
      MONGO_INITDB_ROOT_USERNAME: aziz
      MONGO_INITDB_ROOT_PASSWORD: aziz333
    <<:  *common-service

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
      - "9093:9093"
      - "9094:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    <<:  *common-service
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  prometheus:
    image: prom/prometheus:v3
    volumes:
      - ./infra/observability/prometheus/prometheus-dev.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux-specific fix
    <<:  *common-service

  grafana:
    image: grafana/grafana:13.1-slim
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN: aziz
      GF_SECURITY_ADMIN_PASSWORD: aziz333
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning/dashboards/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./infra/observability/grafana/provisioning/dashboards/json:/var/lib/grafana/dashboards
      - ./infra/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    <<:  *common-service

  # Exporters

  node-exporter:
    image: prom/node-exporter:v1.10.2
    ports:
      - "9100:9100"
    <<: *common-service

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.18.1
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://aziz:aziz333@postgres:5432/postgres?sslmode=disable"
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
    depends_on:
      - postgres
    <<:  *common-service

  redis-exporter:
    image: oliver006/redis_exporter:v1.80.1-alpine
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: "redis:6379"
    depends_on:
      - redis
    <<:  *common-service

  mongo-exporter:
    image: percona/mongodb_exporter:0.47.2
    ports:
      - "9216:9216"
    command:
      - "--mongodb.uri=mongodb://aziz:aziz333@mongo:27017/admin?authSource=admin"
    <<:  *common-service

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    ports:
      - "9308:9308"
    command:
      - "--kafka.server=kafka:9092"
    <<: *common-service
    depends_on:
      kafka:
        condition: service_healthy

  # Dev Only

  mailpit:
    image: axllent/mailpit:v1.30
    ports:
      - "8025:8025"
      - "1025:1025"
    <<: *common-service

volumes:
  postgres_data:
  mongo_data:
  kafka_data:
  grafana_data:

networks:
  ecommerce-net:
    external: true