x-common-service: &common-service
  networks:
    ecommerce-net:
  restart: unless-stopped

services:
  postgres:
    image: postgres:alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: aziz
      POSTGRES_PASSWORD: aziz333
    <<: *common-service

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    <<:  *common-service

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./infra/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    environment:
      MONGO_INITDB_DATABASE: product
      MONGO_INITDB_ROOT_USERNAME: aziz
      MONGO_INITDB_ROOT_PASSWORD: aziz333
    <<:  *common-service

  kafka:
    image: bitnami/kafka:latest
    ports:
      - "9092:9092"
      - "9093:9093"
      - "9094:9094"
    volumes:
      - kafka_data:/bitnami/kafka
    environment:
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Define distinct listeners: INTERNAL for Docker network, EXTERNAL for localhost, and CONTROLLER for KRaft
      KAFKA_CFG_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      # KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      # Advertised listeners tell clients where to find Kafka
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      # KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL

      # KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      # KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT

      ALLOW_PLAINTEXT_LISTENER: yes
    <<:  *common-service
    healthcheck:
      test: [ "CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  prometheus:
    image: prom/prometheus:main
    volumes:
      - ./infra/observability/prometheus/prometheus-dev.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux-specific fix
    <<:  *common-service

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN: aziz
      GF_SECURITY_ADMIN_PASSWORD: aziz333
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning/dashboards/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./infra/observability/grafana/provisioning/dashboards/json:/var/lib/grafana/dashboards
      - ./infra/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    <<:  *common-service

  # Exporters

  node-exporter:
    image: prom/node-exporter:v1.10.2
    ports:
      - "9100:9100"
    <<: *common-service

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:master
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://aziz:aziz333@postgres:5432/postgres?sslmode=disable"
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
    depends_on:
      - postgres
    <<:  *common-service

  redis-exporter:
    image: oliver006/redis_exporter:alpine
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: "redis:6379"
    depends_on:
      - redis
    <<:  *common-service

  mongo-exporter:
    image: percona/mongodb_exporter:0.47.2
    ports:
      - "9216:9216"
    command:
      - "--mongodb.uri=mongodb://aziz:aziz333@mongo:27017/admin?authSource=admin"
    <<:  *common-service

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    ports:
      - "9308:9308"
    command:
      - "--kafka.server=kafka:9092"
    <<: *common-service
    depends_on:
      kafka:
        condition: service_healthy

  # Dev Only

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    <<: *common-service

volumes:
  postgres_data:
  mongo_data:
  kafka_data:
  grafana_data:

networks:
  ecommerce-net:
    external: true