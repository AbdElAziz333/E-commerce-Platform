x-common-service: &common-service
  networks:
    ecommerce-net:
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: aziz
      POSTGRES_PASSWORD: aziz333
    <<: *common-service

  redis:
    image: redis:8.6.2-alpine
    ports:
      - "6379:6379"
    <<:  *common-service

  # Dev Only

  mailpit:
    image: axllent/mailpit:v1.30
    ports:
      - "8025:8025"
      - "1025:1025"
    <<: *common-service

volumes:
  postgres_data:

networks:
  ecommerce-net:
    external: true