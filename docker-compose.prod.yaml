x-common-env: &common-env
  DISCOVERY_SERVER: discovery-server
  DISCOVERY_SERVER_PORT: 8080

x-common-healthcheck: &common-healthcheck
  interval: 10s
  timeout: 5s
  retries: 10
  start_period: 90s

x-common-service: &common-service
  networks:
    ecommerce-net:
  restart: unless-stopped
  stdin_open: true
  tty: true

services:
  discovery-server:
    image: abdelaziz333/discovery-server:1.0
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      <<: *common-env
    <<: *common-service
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health" ]
      <<: *common-healthcheck
    profiles:
      - app
      - all

  auth-service:
    image: abdelaziz333/auth-service:1.0
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      <<: *common-env
      PORT: 8081
      POSTGRES_DB: auth
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_USER: ${REDIS_USER}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
    <<: *common-service
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health" ]
      <<: *common-healthcheck
    profiles:
      - app
      - all

  product-service:
    image: abdelaziz333/product-service:1.0
    build:
      context: .
      dockerfile: product-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      <<: *common-env
      PORT: 8082
      MONGO_DB: ${MONGO_DB}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
    <<: *common-service
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health" ]
      <<: *common-healthcheck
    profiles:
      - app
      - all

  cart-service:
    image: abdelaziz333/cart-service:1.0
    build:
      context: .
      dockerfile: cart-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      <<: *common-env
      PORT: 8083
      POSTGRES_HOST: postgres
      POSTGRES_DB: cart
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_USER: ${REDIS_USER}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    <<: *common-service
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health" ]
      <<: *common-healthcheck
    profiles:
      - app
      - all

  order-service:
    image: abdelaziz333/order-service:1.0
    build:
      context: .
      dockerfile: order-service/Dockerfile
    ports:
      - "8084:8084"
    environment:
      <<: *common-env
      PORT: 8084
      POSTGRES_DB: order
      POSTGRES_USER: aziz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    <<: *common-service
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health" ]
      <<: *common-healthcheck
    profiles:
      - app
      - all

  payment-service:
    image: abdelaziz333/payment-service:1.0
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    ports:
      - "8085:8085"
    environment:
      <<: *common-env
      PORT: 8085
      POSTGRES_DB: payment
      POSTGRES_USER: aziz
      POSTGRES_PASSWORD: ${PAYMENT_POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    <<: *common-service
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health" ]
      <<: *common-healthcheck
    profiles:
      - app
      - all

  notification-service:
    image: abdelaziz333/notification-service:1.0
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "8086:8086"
    environment:
      <<: *common-env
      PORT: 8086
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    <<: *common-service
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health" ]
      <<: *common-healthcheck
    profiles:
      - app
      - all

  api-gateway:
    image: abdelaziz333/api-gateway:1.0
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8087:8087"
    environment:
      <<: *common-env
    <<: *common-service
    depends_on:
      discovery-server:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health" ]
      <<: *common-healthcheck
    profiles:
      - app
      - all

networks:
  ecommerce-net:
    external: true