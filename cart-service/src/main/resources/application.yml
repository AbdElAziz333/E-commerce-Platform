spring:
  application:
    name: cart-service
  profiles:
    active: prod
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    flyway:
      enabled: true
      locations: classpath:db/migration
      baseline-on-migrate: true
      clean-disabled: true

management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    prometheus:
      access: READ_ONLY
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    com.aziz.cart_service: DEBUG
  pattern:
    console: "%d{HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

server:
  port: ${PORT}